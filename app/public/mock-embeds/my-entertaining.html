<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>My Entertaining (mock)</title>
    <style>
      /* Stand-in for the My Entertaining calendar page (decision D8 b). The block's iframe keeps the original size from
         UBTConnect_EmbedMyEntertaining.Blocks.Embedded_MyEntertaining.css (width 100%, min-height calc(100vh - header));
         this page fills it with a fictional "timeline" view of the mock user's entertaining (who hosts whom, when, which
         meal, which guests), from the directory cast of the app (src/mocks/fictional/directory.ts: the Bahia Blanca
         households, the mock user Matías Vitale of the Vitale household). The real page is an external CMS (not a TST
         file): its look is not known, so this one is plain. Query: view, theme, sources (the init options of the
         stand-in SDK, app/src/screens/MyEntertaining/components/connect2Entertaining.ts); sources is a comma list of
         orbit, ldm, assemble, personal (Type_MyCalendarEventSource → PreloadedSource), '' = all. Messages to the parent
         (only shapes the compiled block reads, Embedded_MyEntertaining.mvc.js InitializeCalendarJS): `events:loaded`
         with failedSources [] once rendered, `embed:open-map` {lat, lng, label} from the Map buttons. From the parent:
         `sources:set` {sources} (the stand-in SDK's setSources). Fictional addresses; coordinates are Bahía Blanca
         neighbourhoods, not homes. */
      :root {
        --surface: #f4f4f4;
        --card: #ffffff;
        --text: #1d2a30;
        --muted: #5f6b70;
        --line: #e2e6e8;
        --primary: #0e7c90;
        --primary-soft: #e3f2f5;
        --ldm: #8a5a00;
        --ldm-soft: #fff1d6;
        --orbit: #3949ab;
        --orbit-soft: #e8eaf6;
        --assemble: #2e7d32;
        --assemble-soft: #e6f4e7;
        --personal: #7b1fa2;
        --personal-soft: #f3e5f5;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--surface);
        color: var(--text);
        font:
          14px/1.4 Inter,
          Roboto,
          -apple-system,
          'Segoe UI',
          Helvetica,
          Arial,
          sans-serif;
      }
      main {
        min-height: 100vh;
        padding: 12px 16px 24px;
      }
      .summary {
        margin: 0 0 10px;
        color: var(--muted);
        font-size: 13px;
      }
      .filters {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding-bottom: 4px;
        margin-bottom: 8px;
        scrollbar-width: none;
      }
      .filters button {
        flex: none;
        border: 1px solid var(--line);
        background: var(--card);
        color: var(--text);
        border-radius: 16px;
        padding: 6px 12px;
        font: inherit;
        font-size: 13px;
        cursor: pointer;
      }
      .filters button[aria-pressed='true'] {
        background: var(--primary);
        border-color: var(--primary);
        color: #fff;
      }
      h2 {
        margin: 16px 0 8px;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.02em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .event {
        background: var(--card);
        border-radius: 12px;
        padding: 12px 14px;
        margin-bottom: 10px;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
        border-left: 4px solid var(--primary);
      }
      .event[data-source='ldm'] {
        border-left-color: var(--ldm);
      }
      .event[data-source='orbit'] {
        border-left-color: var(--orbit);
      }
      .event[data-source='assemble'] {
        border-left-color: var(--assemble);
      }
      .event[data-source='personal'] {
        border-left-color: var(--personal);
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .time {
        font-size: 13px;
        color: var(--muted);
      }
      .chip {
        display: inline-block;
        border-radius: 10px;
        padding: 2px 8px;
        font-size: 11px;
        font-weight: 600;
        white-space: nowrap;
      }
      .chip.ldm {
        background: var(--ldm-soft);
        color: var(--ldm);
      }
      .chip.orbit {
        background: var(--orbit-soft);
        color: var(--orbit);
      }
      .chip.assemble {
        background: var(--assemble-soft);
        color: var(--assemble);
      }
      .chip.personal {
        background: var(--personal-soft);
        color: var(--personal);
      }
      .title {
        margin: 6px 0 2px;
        font-size: 16px;
        font-weight: 600;
      }
      .host {
        margin: 0;
        color: var(--muted);
      }
      .rsvp {
        font-size: 11px;
        font-weight: 600;
        border-radius: 10px;
        padding: 2px 8px;
        background: var(--primary-soft);
        color: var(--primary);
      }
      .rsvp[data-status='Tentative'] {
        background: #fff4e5;
        color: #9a5b00;
      }
      .rsvp[data-status='Declined'] {
        background: #fdecea;
        color: #b3261e;
      }
      .meal {
        margin: 8px 0 0;
      }
      .guests {
        list-style: none;
        margin: 8px 0 0;
        padding: 8px 0 0;
        border-top: 1px solid var(--line);
      }
      .guests li {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        padding: 2px 0;
      }
      .guests .status {
        color: var(--muted);
        font-size: 12px;
      }
      .place {
        margin-top: 8px;
        gap: 12px;
      }
      .place address {
        font-style: normal;
        color: var(--muted);
        font-size: 13px;
      }
      .place button {
        flex: none;
        border: 0;
        background: none;
        color: var(--primary);
        font: inherit;
        font-weight: 600;
        cursor: pointer;
        padding: 4px 0;
      }
      .note {
        margin: 8px 0 0;
        font-size: 13px;
        font-style: italic;
        color: var(--muted);
      }
      .empty {
        margin: 32px 0;
        text-align: center;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main aria-label="My Entertaining (mock)">
      <p class="summary" id="summary"></p>
      <div class="filters" id="filters" role="group" aria-label="Calendars"></div>
      <div id="timeline"></div>
    </main>
    <script>
      (function () {
        var SOURCES = [
          { id: 'ldm', label: "Lord's Day Meal" },
          { id: 'orbit', label: 'Orbit' },
          { id: 'assemble', label: 'Assemble' },
          { id: 'personal', label: 'Personal' },
        ];
        var HOME = { address: '120 Las Margaritas, Bahia Blanca', lat: -38.7051, lng: -62.2694 };

        /* The mock user's household (Vitale, Julián & Fiorella; Matías, Valeria & Ignacio) hosts and is hosted. RSVP
           values are those of UBTConnect.Type_RSVPStatus (Host, Accepted, Tentative, Declined). */
        var EVENTS = [
          {
            source: 'ldm',
            day: 'Sunday 18 October 2026',
            time: '12:30 – 14:30',
            title: "Lord's Day Meal at home",
            host: 'Hosted by Vitale, Julián & Fiorella (your household)',
            rsvp: 'Host',
            meal: 'Asado with salads, then flan with dulce de leche · 14 at the table',
            guests: [
              ['Pérez, Jorge & Nora, with Elsa', 'Accepted'],
              ['Rojas, Leo & Paula, and 4 children', 'Accepted'],
              ['Benítez, Alicia & Mariano', 'Tentative'],
            ],
            place: HOME,
          },
          {
            source: 'orbit',
            day: 'Tuesday 20 October 2026',
            time: '19:30 – 21:30',
            title: 'Dinner for Pablo & Ana Ortiz',
            host: 'Hosted by Pérez, Jorge & Nora',
            rsvp: 'Accepted',
            meal: 'Milanesas and pumpkin soup · 9 at the table',
            guests: [
              ['Ortiz, Pablo & Ana, and Benicio (from Rosario)', 'Accepted'],
              ['Vitale, Julián & Fiorella, with Matías', 'Accepted'],
            ],
            place: { address: '312 Pasaje Darregueira, Bahia Blanca', lat: -38.7158, lng: -62.2611 },
            note: 'Ana is visiting her parents for a week.',
          },
          {
            source: 'personal',
            day: 'Wednesday 21 October 2026',
            time: '18:00 – 19:00',
            title: 'Mate and medialunas with Diego & Natalia',
            host: 'Hosted by Acosta, Diego & Natalia',
            rsvp: 'Accepted',
            meal: 'Afternoon tea',
            guests: [['Matías Vitale', 'Accepted']],
            place: { address: '248 Calle Zapiola, Bahia Blanca', lat: -38.7262, lng: -62.2578 },
          },
          {
            source: 'assemble',
            day: 'Saturday 24 October 2026',
            time: '12:00 – 14:00',
            title: 'Lunch for the Monte Hermoso visitors',
            host: 'Hosted by Torres, Gustavo & Laura (Patagonia)',
            rsvp: 'Accepted',
            meal: 'Empanadas and fruit salad · 22 at the tables',
            guests: [
              ['Visitors from Monte Hermoso (5 households)', 'Accepted'],
              ['Vitale, Julián & Fiorella, and 3 children', 'Accepted'],
              ['Flores, Fernando & Patricia, and 5 children', 'Tentative'],
            ],
            place: { address: '359 Calle Zapiola, Bahia Blanca', lat: -38.7317, lng: -62.2449 },
          },
          {
            source: 'ldm',
            day: 'Sunday 25 October 2026',
            time: '12:30 – 14:30',
            title: "Lord's Day Meal with the Molinas",
            host: 'Hosted by Molina, Juan & Rosa',
            rsvp: 'Accepted',
            meal: 'Roast chicken with potatoes, then lemon tart · 12 at the table',
            guests: [
              ['Vitale, Julián & Fiorella, and 3 children', 'Accepted'],
              ['Silva, Marta', 'Accepted'],
              ['Muñoz, Héctor & Norma', 'Declined'],
            ],
            place: { address: '860 Los Tamarindos, Bahia Blanca', lat: -38.6987, lng: -62.2812 },
          },
          {
            source: 'orbit',
            day: 'Tuesday 27 October 2026',
            time: '20:00 – 22:00',
            title: 'Welcome dinner for Hugo & María Vitale',
            host: 'Hosted by Vitale, Julián & Fiorella (your household)',
            rsvp: 'Host',
            meal: 'Lamb stew from Patagonia · 7 at the table',
            guests: [['Vitale, Hugo & María, with Daniel (from Puerto Madryn)', 'Accepted']],
            place: HOME,
            note: 'Arriving by bus at 18:40; Matías collects them from the terminal.',
          },
          {
            source: 'ldm',
            day: 'Sunday 1 November 2026',
            time: '12:30 – 14:30',
            title: "Lord's Day Meal with the Castillos",
            host: 'Hosted by Castillo, Néstor & Ana',
            rsvp: 'Tentative',
            meal: 'Pasta with tuco · 11 at the table',
            guests: [
              ['Vitale, Julián & Fiorella, and 3 children', 'Tentative'],
              ['Herrera, Carlos & Andrea, Iván & Lola', 'Accepted'],
            ],
            place: { address: '322 Calle Zapiola, Bahia Blanca', lat: -38.7224, lng: -62.2507 },
          },
        ];

        var origin = window.location.origin;
        function post(message) {
          if (window.parent !== window) window.parent.postMessage(message, origin);
        }

        var query = new URLSearchParams(window.location.search);
        var active = (query.get('sources') || '').split(',').filter(Boolean);

        function labelOf(id) {
          for (var i = 0; i < SOURCES.length; i++) if (SOURCES[i].id === id) return SOURCES[i].label;
          return id;
        }
        function el(tag, className, text) {
          var node = document.createElement(tag);
          if (className) node.className = className;
          if (text != null) node.textContent = text;
          return node;
        }

        function renderFilters() {
          var bar = document.getElementById('filters');
          bar.textContent = '';
          [{ id: '', label: 'All calendars' }].concat(SOURCES).forEach(function (s) {
            var b = el('button', '', s.label);
            b.type = 'button';
            b.setAttribute('aria-pressed', String(s.id ? active.length === 1 && active[0] === s.id : !active.length));
            b.addEventListener('click', function () {
              active = s.id ? [s.id] : [];
              render();
            });
            bar.appendChild(b);
          });
        }

        function renderEvent(e) {
          var card = el('article', 'event');
          card.setAttribute('data-source', e.source);
          var top = el('div', 'row');
          top.appendChild(el('span', 'time', e.time));
          top.appendChild(el('span', 'chip ' + e.source, labelOf(e.source)));
          card.appendChild(top);
          card.appendChild(el('h3', 'title', e.title));
          var host = el('div', 'row');
          host.appendChild(el('p', 'host', e.host));
          var rsvp = el('span', 'rsvp', e.rsvp);
          rsvp.setAttribute('data-status', e.rsvp);
          host.appendChild(rsvp);
          card.appendChild(host);
          card.appendChild(el('p', 'meal', e.meal));
          var list = el('ul', 'guests');
          list.setAttribute('aria-label', 'Guests');
          e.guests.forEach(function (g) {
            var li = el('li');
            li.appendChild(el('span', '', g[0]));
            li.appendChild(el('span', 'status', g[1]));
            list.appendChild(li);
          });
          card.appendChild(list);
          var place = el('div', 'row place');
          place.appendChild(el('address', '', e.place.address));
          var map = el('button', '', 'Map');
          map.type = 'button';
          map.addEventListener('click', function () {
            post({ type: 'embed:open-map', lat: e.place.lat, lng: e.place.lng, label: e.place.address });
          });
          place.appendChild(map);
          card.appendChild(place);
          if (e.note) card.appendChild(el('p', 'note', e.note));
          return card;
        }

        function render() {
          renderFilters();
          var shown = EVENTS.filter(function (e) {
            return !active.length || active.indexOf(e.source) >= 0;
          });
          var hosting = shown.filter(function (e) {
            return e.rsvp === 'Host';
          }).length;
          document.getElementById('summary').textContent =
            'Next two weeks · ' + shown.length + ' occasions, ' + hosting + ' at home';
          var timeline = document.getElementById('timeline');
          timeline.textContent = '';
          var day = '';
          shown.forEach(function (e) {
            if (e.day !== day) {
              day = e.day;
              timeline.appendChild(el('h2', '', day));
            }
            timeline.appendChild(renderEvent(e));
          });
          if (!shown.length) timeline.appendChild(el('p', 'empty', 'Nothing planned in this calendar yet.'));
        }

        window.addEventListener('message', function (event) {
          if (event.source !== window.parent || !event.data || event.data.type !== 'sources:set') return;
          active = (event.data.sources || '').split(',').filter(Boolean);
          render();
        });

        render();
        post({ type: 'events:loaded', failedSources: [] });
      })();
    </script>
  </body>
</html>
