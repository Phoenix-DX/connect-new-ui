<meta charset="utf-8">
<title>UBTConnect UI Flows and Journeys</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:wght@400;500;600&display=swap">
<style>
[hidden] { display: none !important }   /* the publish skeleton has it too; the local preview needs it */
/* Layout: a map of the OutSystems module. A sticky bar with three views (Overview, Health, Method); the overview reads
   top-down: key figures, the DEV-to-specification funnel, then UI flows grouped by area beside a "Needs attention"
   rail; a flow opens as its own view; a screen opens in a side panel with its TST screenshots. */
:root {
  --bg: #f3f6f6; --surface: #ffffff; --surface-2: #e9eff0; --ink: #12262a; --ink-2: #3c5459; --muted: #627579;
  --line: #d3dee0; --accent: #0a6c88; --in: #0a82a6; --out: #a4aba9; --dev: #c96a12; --dev-ink: #9a4f0b;
  --focus: #0a82a6; --shadow: 0 1px 2px rgba(18, 38, 42, .06), 0 4px 14px rgba(18, 38, 42, .05);
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: "Public Sans", "Helvetica Neue", Arial, system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0d1517; --surface: #142024; --surface-2: #1a292d; --ink: #e4eef0; --ink-2: #b3c5c9; --muted: #869a9e;
  --line: #29393d; --accent: #5ec4de; --in: #2f9fbd; --out: #5b6664; --dev: #d47626; --dev-ink: #f0a35f;
  --focus: #5ec4de; --shadow: 0 1px 2px rgba(0, 0, 0, .3); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0d1517; --surface: #142024; --surface-2: #1a292d; --ink: #e4eef0; --ink-2: #b3c5c9; --muted: #869a9e;
  --line: #29393d; --accent: #5ec4de; --in: #2f9fbd; --out: #5b6664; --dev: #d47626; --dev-ink: #f0a35f;
  --focus: #5ec4de; --shadow: 0 1px 2px rgba(0, 0, 0, .3); color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.55;
  -webkit-font-smoothing: antialiased }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10;
  background: var(--surface) }
a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 2px }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.15; text-wrap: balance; margin: 0 }
h1 { font-size: clamp(1.7rem, 3.4vw, 2.3rem); font-weight: 700; letter-spacing: -.01em }
h2 { font-size: 1.3rem; font-weight: 700 }
h3 { font-size: 1.02rem; font-weight: 600 }
p { margin: 0 }
.mono { font-family: var(--font-mono); font-size: .92em }
.muted { color: var(--muted) }
.eyebrow { font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600 }
.num { font-variant-numeric: tabular-nums }

.bar-top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface);
  border-bottom: 1px solid var(--line) }
.bar-inner, main { max-width: 1200px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.bar-inner { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; padding-block: 10px }
.brand { display: flex; align-items: baseline; gap: 10px; font-family: var(--font-display); font-weight: 700;
  font-size: 1.05rem; color: var(--ink); text-decoration: none }
.brand small { font-family: var(--font-body); font-weight: 500; font-size: .78rem; color: var(--muted) }
nav.views { display: flex; gap: 4px; margin-left: auto; flex-wrap: wrap }
nav.views a { padding: 6px 12px; border-radius: 999px; color: var(--ink-2); text-decoration: none; font-weight: 500;
  font-size: .9rem }
nav.views a[aria-current="page"] { background: var(--surface-2); color: var(--ink) }
main { padding-block: 28px 64px; display: grid; gap: 28px }

.intro { display: grid; gap: 8px; max-width: 70ch }
.intro p { color: var(--ink-2) }
.fresh { font-size: .8rem; color: var(--muted) }

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px;
  display: grid; gap: 2px; min-width: 0 }
.kpi b { font-family: var(--font-display); font-size: 1.9rem; font-weight: 700; line-height: 1.1;
  font-variant-numeric: tabular-nums }
.kpi span { font-weight: 600; font-size: .9rem }
.kpi small { color: var(--muted); font-size: .8rem }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px;
  display: grid; gap: 14px; align-content: start; min-width: 0 }
.panel > header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px }

.funnel { display: grid; gap: 8px }
.frow { display: grid; grid-template-columns: minmax(120px, 210px) 1fr; gap: 12px; align-items: center }
.frow .lab { font-size: .88rem; color: var(--ink-2) }
.ftrack { position: relative; height: 26px; margin-right: 34px }
.fbar { height: 100%; background: var(--in); border-radius: 0 4px 4px 0; display: flex; align-items: center;
  justify-content: flex-end; min-width: 2px }
.fbar.step0 { background: color-mix(in srgb, var(--in) 45%, var(--surface)) }
.fbar.step1 { background: color-mix(in srgb, var(--in) 70%, var(--surface)) }
.fval { position: absolute; top: 50%; transform: translateY(-50%); font-weight: 600; font-size: .9rem;
  font-variant-numeric: tabular-nums; color: var(--ink); padding-left: 8px }

.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: .82rem; color: var(--ink-2) }
.sw { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: 6px }
.sw.in, .seg.in { background: var(--in) }
.sw.out, .seg.out { background: repeating-linear-gradient(135deg, var(--out) 0 3px,
  color-mix(in srgb, var(--out) 55%, var(--surface)) 3px 6px) }
.sw.dev, .seg.dev { background: var(--dev) }

.overview-grid { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 24px; align-items: start }
@media (max-width: 960px) { .overview-grid { grid-template-columns: minmax(0, 1fr) } }
.map-tools { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; min-width: 0 }
.map-tools select { max-width: 100%; min-width: 0 }
.search { flex: 1 1 220px; max-width: 360px; min-width: 0 }
.search input { width: 100%; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; font: inherit;
  background: var(--surface); color: var(--ink) }
.area { display: grid; gap: 10px }
.area > header { display: grid; gap: 2px }
.area > header p { color: var(--muted); font-size: .86rem }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px }
.card { display: grid; gap: 8px; align-content: start; background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 12px 14px; text-decoration: none; color: inherit; min-width: 0;
  transition: border-color .15s, box-shadow .15s }
.card:hover { border-color: var(--accent); box-shadow: var(--shadow) }
.card .fname { font-family: var(--font-mono); font-size: .8rem; color: var(--muted); overflow-wrap: anywhere }
.card .flabel { font-weight: 600; line-height: 1.3 }
.card .fmeta { font-size: .8rem; color: var(--ink-2) }
.stack { display: flex; gap: 2px; height: 10px; border-radius: 3px; overflow: hidden; background: var(--surface-2) }
.stack .seg { height: 100% }
.stack.lg { height: 14px }
.tag { display: inline-flex; align-items: center; gap: 4px; font-size: .74rem; font-weight: 600; padding: 2px 8px;
  border-radius: 999px; border: 1px solid var(--line); color: var(--ink-2); white-space: nowrap }
.tag.lib { background: var(--surface-2) }
.tag.warn { border-color: var(--dev); color: var(--dev-ink) }

.rail { display: grid; gap: 12px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 72px) }
@media (max-width: 960px) { .rail { position: static; order: -1 } }
.attention { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none }
.attention li { display: grid; grid-template-columns: 22px 1fr; gap: 8px; font-size: .88rem }
.attention .ico { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-weight: 700;
  font-size: .78rem; border: 1.5px solid var(--dev); color: var(--dev-ink) }
.attention .ico.info { border-color: var(--accent); color: var(--accent) }

.chip { display: inline-flex; align-items: center; gap: 6px; font-size: .78rem; font-weight: 600; padding: 2px 9px;
  border-radius: 999px; white-space: nowrap }
.chip::before { content: ""; width: 8px; height: 8px; border-radius: 2px }
.chip.in { background: color-mix(in srgb, var(--in) 14%, var(--surface)); color: var(--accent) }
.chip.in::before { background: var(--in) }
.chip.out { background: var(--surface-2); color: var(--ink-2) }
.chip.out::before { background: repeating-linear-gradient(135deg, var(--out) 0 2px, transparent 2px 4px);
  border: 1px solid var(--out) }
.chip.dev { background: color-mix(in srgb, var(--dev) 14%, var(--surface)); color: var(--dev-ink) }
.chip.dev::before { background: var(--dev) }
.chip.unused { background: transparent; border: 1px dashed var(--out); color: var(--muted) }
.chip.unused::before { display: none }

.crumbs { font-size: .84rem; color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap }
.flow-head { display: grid; gap: 10px; max-width: 80ch }
.flow-head .fname { font-family: var(--font-mono); font-size: .9rem; color: var(--muted) }
.flow-head p { color: var(--ink-2); font-size: 1.02rem }
.facts { display: flex; flex-wrap: wrap; gap: 8px }

.tablewrap { overflow-x: auto; margin: 0 -4px; padding: 0 4px }
table { border-collapse: collapse; width: 100%; font-size: .88rem }
th { text-align: left; font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted);
  font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap }
td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: top }
tr:last-child td { border-bottom: 0 }
td .why { color: var(--ink-2); font-size: .84rem; margin-top: 4px; max-width: 52ch }
.linkbtn { background: none; border: 0; padding: 0; font: inherit; font-weight: 600; color: var(--accent);
  cursor: pointer; text-align: left; text-decoration: underline; text-decoration-thickness: 1px;
  text-underline-offset: 2px }
.pills { display: flex; flex-wrap: wrap; gap: 4px }
.pill { font-family: var(--font-mono); font-size: .76rem; padding: 1px 7px; border-radius: 6px;
  background: var(--surface-2); color: var(--ink-2); text-decoration: none; white-space: nowrap }
a.pill:hover { color: var(--accent) }
.pill.ext { background: transparent; border: 1px solid var(--line) }
.pill.shared { font-family: var(--font-body); background: transparent; border: 1px dashed var(--accent);
  color: var(--accent) }
details > summary { cursor: pointer; font-weight: 600; color: var(--ink-2) }
details[open] > summary { margin-bottom: 10px }

.drawer-back { position: fixed; inset: 0; background: rgba(8, 18, 20, .35); z-index: 20 }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(640px, 100%); background: var(--surface);
  z-index: 21; overflow-y: auto; box-shadow: -8px 0 30px rgba(0, 0, 0, .18);
  padding: calc(env(safe-area-inset-top, 0px) + 18px) max(18px, env(safe-area-inset-right, 0px))
  calc(env(safe-area-inset-bottom, 0px) + 32px) 20px; display: grid; gap: 18px; align-content: start }
.drawer header { display: grid; gap: 6px; padding-right: 44px; position: relative }
.close { position: absolute; top: -4px; right: 0; width: 36px; height: 36px; border-radius: 50%;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-size: 1.2rem; cursor: pointer }
.shots { display: grid; gap: 10px }
.tabs { display: flex; flex-wrap: wrap; gap: 6px }
.tabs button { font: inherit; font-size: .82rem; padding: 4px 11px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink-2); cursor: pointer }
.tabs button[aria-selected="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink) }
.phone { width: min(300px, 100%); border: 1px solid var(--line); border-radius: 18px; overflow: hidden;
  background: var(--surface-2); justify-self: start }
.phone img { display: block; width: 100%; height: auto }
.noshot { padding: 18px; border: 1px dashed var(--line); border-radius: var(--radius); color: var(--muted);
  font-size: .88rem }
dl.kv { display: grid; grid-template-columns: minmax(110px, 160px) 1fr; gap: 8px 14px; margin: 0; font-size: .88rem }
dl.kv dt { color: var(--muted) }
dl.kv dd { margin: 0; min-width: 0 }

.health { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 14px }
.health .panel h3 { display: flex; align-items: baseline; gap: 10px }
.health .panel h3 b { font-family: var(--font-display); font-size: 1.5rem }
.health ul { margin: 0; padding-left: 18px; display: grid; gap: 6px; font-size: .88rem }
.prose { display: grid; gap: 12px; max-width: 72ch }
.prose p, .prose li { color: var(--ink-2) }
.empty { color: var(--muted); font-size: .9rem }
/* journeys: a chain of screens with the action between two steps */
.jgroups { display: grid; gap: 28px }
.jgroup { display: grid; gap: 12px }
.journey { scroll-margin-top: 80px }
.journey > header { display: grid; gap: 4px }
.journey > header h3 { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap }
.jid { font-family: var(--font-mono); font-size: .78rem; color: var(--muted); font-weight: 500 }
.chain { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 10px 0 }
.step { width: 148px; display: grid; gap: 6px; background: none; border: 0; padding: 0; text-align: left; font: inherit;
  color: inherit; cursor: pointer }
.step .thumb { height: 176px; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--surface-2) }
.step .thumb img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block }
.step .thumb .none { height: 100%; display: grid; place-items: center; padding: 10px; text-align: center; font-size: .74rem;
  color: var(--muted) }
.step:hover .thumb { border-color: var(--accent) }
.step .sname { font-family: var(--font-mono); font-size: .76rem; font-weight: 500; overflow-wrap: anywhere; color: var(--accent);
  text-decoration: underline; text-underline-offset: 2px }
.step .sflow { font-size: .74rem; color: var(--muted) }
.how { width: 124px; padding: 70px 10px 0; display: grid; gap: 4px; justify-items: center; text-align: center;
  font-size: .76rem; color: var(--ink-2); line-height: 1.35 }
.how .arrow { color: var(--accent); font-size: 1.2rem; line-height: 1 }
.jnotes { margin: 0; padding-left: 18px; font-size: .82rem; color: var(--ink-2) }
.chip.ok { background: color-mix(in srgb, var(--in) 14%, var(--surface)); color: var(--accent) }
.chip.ok::before { background: var(--in); border-radius: 50% }
.chip.stop { background: color-mix(in srgb, var(--dev) 14%, var(--surface)); color: var(--dev-ink) }
.chip.stop::before { background: var(--dev); clip-path: polygon(50% 0, 100% 100%, 0 100%); border-radius: 0 }
.chip.flag { background: var(--surface-2); color: var(--ink-2) }
.chip.flag::before { background: transparent; border: 1.5px dashed var(--muted) }
.journey h3 .chip { font-family: var(--font-body); font-size: .74rem }
.pre, .jstop { font-size: .84rem; color: var(--ink-2); margin: 0 }
.jstop { border-left: 3px solid var(--dev); padding: 4px 0 4px 10px }
.step.stop .thumb { border: 2px solid var(--dev) }
.step .thumb { position: relative }
.stopmark { position: absolute; left: 6px; right: 6px; bottom: 6px; background: var(--dev); color: #fff; font-size: .7rem;
  font-weight: 600; border-radius: 6px; padding: 2px 6px; text-align: center }
.filters { display: flex; flex-wrap: wrap; gap: 6px; align-items: center }
.filters button { font: inherit; font-size: .84rem; padding: 5px 12px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink-2); cursor: pointer }
.filters button[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink) }
.linkpill { border: 0; cursor: pointer; font: inherit; font-family: var(--font-mono); font-size: .76rem }
.linkpill:hover { color: var(--accent) }
.jtag { font-family: var(--font-body); font-size: .68rem; color: var(--accent); font-weight: 600 }
table.steps td { font-size: .84rem }
table.steps td:nth-child(3) { min-width: 220px; max-width: 360px }
.appmap svg { min-width: 1000px }
.appmap.focus .me:not(.on) { opacity: .14 }
.appmap .mn rect { fill: var(--surface); stroke: var(--line) }
.appmap .mn text { fill: var(--ink); font-size: 12.5px }
.appmap .mn.on rect { fill: color-mix(in srgb, var(--in) 16%, var(--surface)); stroke: var(--in); stroke-width: 2 }
.appmap .mn.dim { opacity: .45 }
.appmap .mn .mstep { fill: var(--accent); font-weight: 700; font-family: var(--font-mono); font-size: 11px }
.appmap a .mn:hover rect { stroke: var(--accent); stroke-width: 2 }
.appmap .me { fill: none; stroke: var(--out); opacity: .55 }
.appmap .me.on { stroke: var(--accent); opacity: 1 }
.map-tools select { font: inherit; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface);
  color: var(--ink); max-width: 100% }
.jlinks { display: flex; flex-wrap: wrap; gap: 6px }
/* flow map: where users come from, the screens of the flow, where they go */
.fmap { overflow-x: auto }
.fmap svg { display: block; min-width: 660px; width: 100%; height: auto; font-family: var(--font-body) }
.fmap .n rect { fill: var(--surface); stroke: var(--line) }
.fmap .n.mid rect { fill: color-mix(in srgb, var(--in) 12%, var(--surface)); stroke: var(--in) }
.fmap .n.mid.out rect { fill: url(#hatch); stroke: var(--out) }
.fmap .n.shared rect { stroke: var(--accent); stroke-dasharray: 4 3 }
.fmap .n text { fill: var(--ink); font-size: 12px }
.fmap .n.mid text { font-family: var(--font-mono); font-size: 11.5px }
.fmap .n .cnt { fill: var(--muted); font-size: 11px }
.fmap a .n:hover rect, .fmap .n.mid:hover rect { stroke: var(--accent); stroke-width: 2 }
.fmap .n.mid { cursor: pointer }
.fmap .e { fill: none; stroke: var(--out); stroke-width: 1.2; opacity: .8 }
.fmap .e.int { stroke: var(--accent); stroke-width: 1.6; opacity: 1 }
.fmap .colh { fill: var(--muted); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; font-weight: 600 }
.fmap .hatch-a { stroke: var(--out); stroke-width: 2 }
.fmap .hatch-bg { fill: color-mix(in srgb, var(--out) 18%, var(--surface)) }
.fmap .mk-e { fill: var(--out) }
.fmap .mk-i { fill: var(--accent) }
@media (max-width: 560px) {
  .chain { flex-direction: column; flex-wrap: nowrap }
  .step { width: 100%; grid-template-columns: 64px 1fr; align-items: center; column-gap: 12px }
  .step .thumb { height: 92px; grid-row: span 2 }
  .how { width: auto; padding: 4px 0 4px 76px; justify-items: start; text-align: left; grid-template-columns: auto 1fr;
    align-items: center; column-gap: 8px }
  .how .arrow { transform: rotate(90deg) }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important } }
@media (max-width: 560px) {
  .frow { grid-template-columns: 1fr; gap: 2px }
  dl.kv { grid-template-columns: 1fr; gap: 2px 0 }
  dl.kv dd { margin-bottom: 8px }
  /* tables become one card per row; each cell shows its column name */
  .tablewrap thead { display: none }
  .tablewrap tr { display: grid; gap: 8px; padding: 12px 0; border-bottom: 1px solid var(--line) }
  .tablewrap tr:last-child { border-bottom: 0 }
  .tablewrap td { border: 0; padding: 0 }
  .tablewrap td[data-th]:not(:first-child)::before { content: attr(data-th); display: block; font-size: .7rem;
    letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin-bottom: 2px }
}
/*[lib]*/
/* Shared libraries view (libraries.html only; the builder removes every [lib] block from index.html).
   Two more hues: indigo for UBTConnect_Utils, plum for Connect2_LegacyShared; both away from the teal (in scope)
   and the orange (DEV only) of the page. */
:root { --u: #4a5fd0; --u-soft: #e8ebfa; --l: #b5457c; --l-soft: #f8e5ee }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --u: #8f9df0; --u-soft: #262c4d; --l: #e38ab7; --l-soft: #45263a } }
:root[data-theme="dark"] { --u: #8f9df0; --u-soft: #262c4d; --l: #e38ab7; --l-soft: #45263a }
.ldot { display: inline-block; width: 11px; height: 11px; border-radius: 50%; vertical-align: -1px; flex: none }
.ldot.u { background: var(--u) } .ldot.l { background: var(--l) }

  display: grid; gap: 8px; align-content: start }

<header class="bar-top">
  <div class="bar-inner">
    <a class="brand" href="#overview">UBTConnect UI Flows <small>OutSystems app on TST</small></a>
    <nav class="views" aria-label="Views">
      <a href="#overview" data-view="overview">Overview</a>
      <a href="#journeys" data-view="journeys">Journeys</a>
      <a href="#map" data-view="map">App map</a>
      <!--[lib]--><a href="#libraries" data-view="libraries">Libraries</a><!--[/lib]-->
      <a href="#health" data-view="health">Health</a>
      <a href="#method" data-view="method">Method</a>
    </nav>
  </div>
</header>
<main id="main" tabindex="-1"></main>
<div class="drawer-back" id="drawer-back" hidden></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" hidden></aside>

<!--[lib]--><script src="https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.9.1/mermaid.min.js"></script><!--[/lib]-->
<script>
const DATA = /*__DATA__*/null;
const main = document.getElementById('main');
const drawer = document.getElementById('drawer');
const drawerBack = document.getElementById('drawer-back');
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const SCOPE = { in: 'In scope', out: 'Out of scope', dev: 'DEV only' };
const USAGE = { in: 'Used by in-scope screens', out: 'Used only by out-of-scope screens', unused: 'Not used on TST' };
const chip = (k, text) => `<span class="chip ${k}">${esc(text ?? SCOPE[k])}</span>`;
const plural = (n, one, many) => `${n} ${n === 1 ? one : (many ?? one + 's')}`;
let lastFocus = null;

function stack(c, big) {
  const total = c.in + c.out + c.dev;
  if (!total) return '';
  const seg = (k) => c[k] ? `<span class="seg ${k}" style="flex:${c[k]}" title="${esc(SCOPE[k])}: ${c[k]}"></span>` : '';
  return `<div class="stack${big ? ' lg' : ''}" role="img" aria-label="${c.in} in scope, ${c.out} out of scope, ${c.dev} DEV only">${seg('in')}${seg('out')}${seg('dev')}</div>`;
}

function flowMeta(f) {
  if (!f.screens.length) {
    const used = f.blocks.filter((b) => b.usage === 'in').length;
    return `${plural(f.blocks.length, 'block')} · ${used} used by in-scope screens`;
  }
  const parts = [`${f.counts.in} in scope`];
  if (f.counts.out) parts.push(`${f.counts.out} out`);
  if (f.counts.dev) parts.push(`${f.counts.dev} DEV only`);
  return `${plural(f.screens.length, 'screen')} · ${parts.join(' · ')}`;
}

function viewOverview() {
  const c = DATA.counts;
  const funnel = [
    ['Screens on DEV', c.devScreens, 'step0'], ['Screens on TST', c.tstScreens, 'step1'],
    ['In scope', c.inScope, ''], ['Specified', c.specified, ''],
  ];
  const max = c.devScreens;
  const attention = [
    [`${plural(c.devOnly, 'screen exists', 'screens exist')} only on DEV. ${c.devOnly === 1 ? 'It needs' : 'They need'} a scope decision when DEV goes to TST.`, '#health', 'warn'],
    [`${plural(DATA.health.flagScope.length, 'out-of-scope screen')} come${DATA.health.flagScope.length === 1 ? 's' : ''} back into question if a flag is switched on.`, '#health', 'warn'],
    ['The specifications describe the screens and their calls. The server logic behind each call is not specified yet.', '#method', 'warn'],
    [`${plural(c.blocksUnused, 'block')} of the module ${c.blocksUnused === 1 ? 'is' : 'are'} not used by any screen on TST.`, '#health', 'info'],
  ];
  main.innerHTML = `
  <section class="intro">
    <span class="eyebrow">OutSystems module UBTConnect</span>
    <h1>UI flows, scope and specification</h1>
    <p>This page shows the UI flows of the UBTConnect OutSystems app on TST. It also shows the migration analysis: the screens in scope, the reasons for the others, and the specifications.</p>
    <p><a href="#journeys">Journeys</a> shows how users go from screen to screen in the main tasks, with a run on TST. <a href="#map">App map</a> shows the journeys on a map of the UI flows.</p>
    <p class="fresh">Data from the repository at commit <span class="mono">${esc(DATA.meta.commit)}</span>, built ${esc(DATA.meta.builtAt)}. DEV snapshot ${esc(DATA.meta.devTakenAt)}.</p>
  </section>
  <section class="kpis" aria-label="Key figures">
    <div class="kpi"><b>${c.flows}</b><span>UI flows</span><small>${c.screenFlows} with screens, ${c.blockFlows} with blocks only</small></div>
    <div class="kpi"><b>${c.tstScreens}</b><span>Screens on TST</span><small>${c.devScreens} on DEV</small></div>
    <div class="kpi"><b>${c.inScope}</b><span>In scope</span><small>of ${c.tstScreens} screens on TST</small></div>
    <div class="kpi"><b>${c.outOfScope}</b><span>Out of scope</span><small>each with a recorded reason</small></div>
    <div class="kpi"><b>${c.specified}<span class="muted" style="font-size:1rem"> / ${c.inScope}</span></b><span>Specified</span><small>in-scope screens with a specification</small></div>
  </section>
  <section class="panel" aria-labelledby="funnel-h">
    <header><h2 id="funnel-h">From DEV to specification</h2><span class="muted" style="font-size:.84rem">Number of screens at each step</span></header>
    <div class="funnel">${funnel.map(([lab, n, cls]) => `
      <div class="frow"><span class="lab">${lab}</span>
        <div class="ftrack"><div class="fbar ${cls}" style="width:${(n / max) * 100}%" title="${lab}: ${n}"></div>
        <span class="fval" style="left:${(n / max) * 100}%">${n}</span></div></div>`).join('')}
    </div>
  </section>
  <div class="overview-grid">
    <section style="display:grid;gap:20px;min-width:0" aria-labelledby="map-h">
      <div class="map-tools">
        <h2 id="map-h">UI flows by area</h2>
        <label class="search"><span class="eyebrow">Find a flow or a screen</span>
          <input id="flow-search" type="search" placeholder="For example HomeFeed or Directory" autocomplete="off"></label>
      </div>
      <div class="legend" aria-label="Legend"><span><i class="sw in"></i>In scope</span><span><i class="sw out"></i>Out of scope, reason recorded</span><span><i class="sw dev"></i>DEV only, not on TST</span></div>
      <div id="areas" style="display:grid;gap:22px"></div>
    </section>
    <aside class="rail">
      <section class="panel" aria-labelledby="att-h">
        <h2 id="att-h">Needs attention</h2>
        <ul class="attention">${attention.map(([t, href, k]) => `<li><span class="ico ${k === 'info' ? 'info' : ''}" aria-hidden="true">${k === 'info' ? 'i' : '!'}</span><a href="${href}">${esc(t)}</a></li>`).join('')}</ul>
      </section>
      <section class="panel" aria-labelledby="blocks-h">
        <h2 id="blocks-h">Blocks of the module</h2>
        <p class="muted" style="font-size:.86rem">${c.blocks} blocks. Usage on TST:</p>
        <div class="stack lg"><span class="seg in" style="flex:${c.blocksIn}" title="${USAGE.in}: ${c.blocksIn}"></span><span class="seg out" style="flex:${c.blocksOut}" title="${USAGE.out}: ${c.blocksOut}"></span><span class="seg" style="flex:${c.blocksUnused};background:var(--surface-2);outline:1px dashed var(--out);outline-offset:-1px" title="${USAGE.unused}: ${c.blocksUnused}"></span></div>
        <div class="legend" style="display:grid;gap:4px"><span><i class="sw in"></i>${c.blocksIn} used by in-scope screens</span><span><i class="sw out"></i>${c.blocksOut} used only by out-of-scope screens</span><span><i class="sw" style="border:1px dashed var(--out)"></i>${c.blocksUnused} not used on TST</span></div>
      </section>
    </aside>
  </div>`;
  const input = document.getElementById('flow-search');
  const draw = () => {
    const q = input.value.trim().toLowerCase();
    const match = (f) => !q || [f.name, f.label, f.purpose, ...f.screens].some((s) => String(s).toLowerCase().includes(q));
    const html = DATA.areas.map((a) => {
      const fl = a.flows.map((n) => DATA.flows[n]).filter(match);
      if (!fl.length) return '';
      return `<section class="area"><header><h3>${esc(a.name)}</h3><p>${esc(a.text)}</p></header><div class="cards">${fl.map((f) => `
        <a class="card" href="#flow-${esc(f.name)}"><span class="fname">${esc(f.name)}</span><span class="flabel">${esc(f.label)}</span>
        ${f.screens.length ? stack(f.counts) : '<span><span class="tag lib">Blocks only</span></span>'}
        <span class="fmeta">${esc(flowMeta(f))}</span>${f.testOrDev ? '<span><span class="tag warn">Test, development or deprecated flow</span></span>' : ''}</a>`).join('')}</div></section>`;
    }).join('');
    document.getElementById('areas').innerHTML = html || '<p class="empty">No flow or screen matches this search.</p>';
  };
  input.addEventListener('input', draw);
  draw();
}

function screenRow(s) {
  const reason = s.reason;
  return `<tr><td><button class="linkbtn" data-screen="${esc(s.name)}">${esc(s.name)}</button>${s.onTST ? '' : '<div class="why">Not on TST</div>'}</td>
    <td>${chip(s.scope)}${reason ? `<div class="why">${esc(reason)}</div>` : ''}${s.reopen ? `<div class="why"><b>Reopen:</b> ${esc(s.reopen)}</div>` : ''}</td>
    <td>${s.specified ? 'Specified' : '<span class="muted">—</span>'}</td>
    <td class="num">${s.shots && s.shots.length ? plural(s.shots.length, 'state') : '<span class="muted">None</span>'}</td></tr>`;
}

function screenPills(names, flowName, shared) {
  const tags = (shared || []).map((label) => `<span class="pill shared" title="${esc(label)}: ${esc((DATA.sharedNav[label] || []).join(', '))}">${esc(label)}</span>`);
  if ((!names || !names.length) && !tags.length) return '<span class="muted">None</span>';
  return `<div class="pills">${tags.join('')}${(names || []).map((n) => {
    const s = DATA.screens[n];
    if (!s) return `<span class="pill ext">${esc(n)}</span>`;
    const other = s.flow !== flowName;
    return `<a class="pill${other ? ' ext' : ''}" href="#screen-${esc(n)}" title="${other ? 'Flow ' + esc(s.flow) : 'Same flow'}">${esc(n)}</a>`;
  }).join('')}</div>`;
}

function sharedNote() {
  return `<p class="muted" style="font-size:.82rem">${Object.entries(DATA.sharedNav).map(([label, targets]) =>
    `<span class="pill shared">${esc(label)}</span> links of a shared block that many screens show: ${targets.map(esc).join(', ')}.`).join('<br>')}</p>`;
}

function viewFlow(name) {
  const f = DATA.flows[name];
  if (!f) { main.innerHTML = `<p class="empty">No UI flow named ${esc(name)}.</p>`; return; }
  const screens = f.screens.map((n) => DATA.screens[n]);
  const byModule = {};
  f.otherModuleBlocks.forEach((b) => { const m = b.split('.')[0]; (byModule[m] = byModule[m] || []).push(b.split('.').slice(1).join('.')); });
  main.innerHTML = `
  <nav class="crumbs" aria-label="Breadcrumb"><a href="#overview">Overview</a><span>/</span><span>${esc(f.area)}</span></nav>
  <section class="flow-head">
    <span class="eyebrow">UI flow · ${esc(f.area)}</span>
    <h1>${esc(f.label)}</h1>
    <span class="fname">${esc(f.name)}</span>
    <p>${esc(f.purpose)}</p>
    <div class="facts">${f.screens.length ? `<span class="tag">${plural(f.screens.length, 'screen')}</span>` : '<span class="tag lib">Blocks only</span>'}
      <span class="tag">${plural(f.blocks.length, 'block')} of its own</span>
      ${f.otherModuleBlocks.length ? `<span class="tag">${plural(f.otherModuleBlocks.length, 'block')} from other modules</span>` : ''}
      ${f.testOrDev ? '<span class="tag warn">Test, development or deprecated flow</span>' : ''}</div>
    ${journeyLinks(journeysOf(f.screens), 'Main journeys through this flow')}
    ${f.screens.length ? `${stack(f.counts, true)}<div class="legend"><span><i class="sw in"></i>${f.counts.in} in scope</span><span><i class="sw out"></i>${f.counts.out} out of scope</span><span><i class="sw dev"></i>${f.counts.dev} DEV only</span></div>` : ''}
  </section>
  ${screens.length ? `<section class="panel" aria-labelledby="scr-h"><header><h2 id="scr-h">Screens</h2><span class="muted" style="font-size:.84rem">Select a screen for its TST screenshots and details</span></header>
    <div class="tablewrap"><table><thead><tr><th>Screen</th><th>Scope</th><th>Specification</th><th>Screenshots</th></tr></thead>
    <tbody>${screens.map(screenRow).join('')}</tbody></table></div></section>
  ${flowMapPanel(f)}
  <section class="panel" aria-labelledby="nav-h"><header><h2 id="nav-h">How users move</h2><span class="muted" style="font-size:.84rem">Filled: same flow. Outlined: another flow. Dashed: links of a shared block.</span></header>
    <div class="tablewrap"><table><thead><tr><th>Screen</th><th>Opens from</th><th>Leads to</th></tr></thead><tbody>
    ${screens.filter((s) => s.onTST).map((s) => `<tr><td class="mono">${esc(s.name)}</td><td>${screenPills(s.reachedFrom, name, s.reachedShared)}</td><td>${screenPills(s.navOut, name, s.navShared)}</td></tr>`).join('') || '<tr><td colspan="3" class="empty">No screen of this flow is on TST.</td></tr>'}
    </tbody></table></div>${sharedNote()}</section>` : ''}
  <section class="panel" aria-labelledby="blk-h"><header><h2 id="blk-h">Blocks of this flow</h2><span class="muted" style="font-size:.84rem">Usage on TST</span></header>
    ${f.blocks.length ? `<div class="tablewrap"><table><thead><tr><th>Block</th><th>Usage</th><th>Used by</th></tr></thead><tbody>
    ${f.blocks.map((b) => `<tr><td class="mono">${esc(b.name)}</td><td>${chip(b.usage === 'unused' ? 'unused' : b.usage, USAGE[b.usage])}</td><td>${b.usedBy.length ? `${plural(b.usedBy.length, 'screen')}${b.usedBy.length <= 6 ? ': ' + b.usedBy.map(esc).join(', ') : ''}` : '<span class="muted">No screen</span>'}</td></tr>`).join('')}
    </tbody></table></div>` : '<p class="empty">This flow has no blocks of its own.</p>'}
    ${f.otherModuleBlocks.length ? `<details><summary>Blocks from other modules used by these screens (${f.otherModuleBlocks.length})</summary>
      ${Object.entries(byModule).map(([m, bs]) => `<p style="margin-bottom:8px"><span class="eyebrow">${esc(m)}</span><br><span class="pills">${bs.map((b) => `<span class="pill">${esc(b)}</span>`).join('')}</span></p>`).join('')}</details>` : ''}
  </section>`;
}

function journeysOf(names) {
  const set = new Set(names);
  return DATA.journeys.journeys.filter((j) => j.steps.some((st) => set.has(st.screen)));
}

function journeyLinks(list, label) {
  if (!list.length) return '';
  return `<div class="jlinks" aria-label="${esc(label)}"><span class="muted" style="font-size:.84rem">${esc(label)}:</span>${list.map((j) => `<a class="pill ext" href="#journey-${esc(j.id)}">${esc(j.id)} ${esc(j.title)}</a>`).join('')}</div>`;
}

function journeyStatus(j) {
  const r = j.run || {};
  if (r.status === 'verified') return { cls: 'ok', text: r.account ? `Verified on TST · ${r.account} account` : 'Verified on TST' };
  if (r.status === 'blocked') return { cls: 'stop', text: `Stops at ${r.blockedAt && r.blockedAt.screen ? r.blockedAt.screen : 'a step'}` };
  if (j.requires) return { cls: 'flag', text: `Needs ${j.requires.flag} ${j.requires.value}` };
  return { cls: 'flag', text: 'Not run on TST' };
}

function friendlyError(b) {
  const e = b && b.error;
  if (!e) return '';
  const now = ((b.path || '').split('/').pop()) || '';
  if (/^no visible element/.test(e)) return 'The element for the next step is not on the screen. The test account has no data for it, or the screen differs.';
  const m = /expected (\w+), the app shows (\S+)/.exec(e);
  if (m) return `The app opened ${m[2].split('/').pop()} instead of ${m[1]}.`;
  if (/^sent to/.test(e)) return 'The app asked for the sign-in or the PIN again.';
  if (/Timeout|waitForURL/i.test(e)) return now && now.toLowerCase() !== String(b.screen).toLowerCase() ? `The app opened ${now}, not the next screen.` : 'The next screen did not open in time.';
  return e;
}

function stepTile(st, stop) {
  const s = DATA.screens[st.screen];
  const img = (st.run && st.run.img) || (s && s.shots && s.shots[0] && s.shots[0].img);
  const flow = s ? DATA.flows[s.flow] : null;
  return `<button class="step${stop ? ' stop' : ''}" data-screen="${esc(st.screen)}" aria-label="${esc(st.screen)}, open details">
    <span class="thumb">${img ? `<img src="${esc(img)}" alt="" loading="lazy">` : '<span class="none">No screenshot on TST</span>'}${stop ? '<span class="stopmark">Run stops here</span>' : ''}</span>
    <span><span class="sname">${esc(st.screen)}</span><br><span class="sflow">${esc(flow ? flow.label : '')}</span>
    ${s && s.scope !== 'in' ? `<br>${chip(s.scope)}` : ''}</span></button>`;
}

function edgeJourneys(a, b) {
  return DATA.journeys.journeys.filter((j) => j.steps.some((st, i) => st.screen === a && j.steps[i + 1] && j.steps[i + 1].screen === b));
}

function branches(screen, next) {
  const s = DATA.screens[screen];
  if (!s) return '';
  const others = s.navOut.filter((t) => t !== next && t !== EXTERNAL);
  if (!others.length) return '<span class="muted">None</span>';
  return `<div class="pills">${others.map((t) => {
    const js = edgeJourneys(screen, t);
    return `<button class="pill linkpill" data-screen="${esc(t)}" title="${js.length ? 'In ' + js.map((j) => j.id).join(', ') : 'In no main journey'}">${esc(t)}${js.length ? ` <span class="jtag">${js.map((j) => esc(j.id)).join(' ')}</span>` : ''}</button>`;
  }).join('')}</div>`;
}

function stepTable(j) {
  return `<div class="tablewrap"><table class="steps"><thead><tr><th>#</th><th>Screen</th><th>What the user sees</th><th>Action to the next step</th><th>Other ways from here</th></tr></thead><tbody>
  ${j.steps.map((st, i) => {
    const s = DATA.screens[st.screen] || {};
    const a = st.action;
    const r = st.run && st.run.action;
    const el = r && r.element ? r.element.selector + (r.element.index ? ` (item ${r.element.index + 1})` : '') : '';
    const calls = st.run && st.run.calls && st.run.calls.length ? st.run.calls : [];
    return `<tr><td class="num">${i + 1}</td>
      <td><button class="linkbtn" data-screen="${esc(st.screen)}">${esc(st.screen)}</button>${s.back ? `<div class="why">Back: ${esc(s.back)}</div>` : ''}</td>
      <td>${esc(s.sees || '')}${s.does ? `<div class="why">${esc(s.does)}</div>` : ''}</td>
      <td>${a ? `${esc(a.label)}${el ? `<div class="why mono">${esc(el)}</div>` : ''}${calls.length ? `<div class="why">Calls: <span class="mono">${calls.map(esc).join(', ')}</span></div>` : ''}${st.run && st.run.blocked && st.run.blocked.length ? `<div class="why">Blocked by the read-only guard: <span class="mono">${st.run.blocked.map(esc).join(', ')}</span></div>` : ''}` : '<span class="muted">End of the journey</span>'}</td>
      <td>${a ? branches(st.screen, j.steps[i + 1].screen) : ''}</td></tr>`;
  }).join('')}</tbody></table></div>`;
}

/* the app map: UI flows in columns by part of the app; a selected journey shows as a numbered path */
const MAP_COLUMNS = [
  { title: 'Start', areas: ['Start and sign-in', 'Share'] },
  { title: 'Home', areas: ['Home and messages'] },
  { title: 'Directory', areas: ['Directory: countries, localities, search', 'Directory: households', 'Directory: supper meeting, OSG, community business'] },
  { title: 'Programs', areas: ['Orbit', 'LDM', 'Assemble'] },
  { title: 'Saved items', areas: ['Bookmarks'] },
  { title: 'Menu', areas: ['Menu, profile and contact', 'Deprecated'] },
];
let mapJourney = '';
function viewMap() {
  const flowsOn = (a) => (DATA.areas.find((x) => x.name === a) || { flows: [] }).flows.filter((f) => DATA.flows[f] && DATA.flows[f].screens.some((n) => DATA.screens[n].onTST));
  const NW = 162, NH = 30, GAPY = 9, COLW = 202, TOP = 44, AREAGAP = 14;
  const pos = {};
  let H = 0;
  MAP_COLUMNS.forEach((c, ci) => {
    let y = TOP;
    c.areas.forEach((a) => {
      const fl = flowsOn(a);
      if (!fl.length) return;
      fl.forEach((f) => { pos[f] = { x: ci * COLW, y, col: ci }; y += NH + GAPY; });
      y += AREAGAP;
    });
    H = Math.max(H, y);
  });
  const W = (MAP_COLUMNS.length - 1) * COLW + NW + 70;   // room for the arcs of the last column
  const links = {};
  Object.values(DATA.screens).filter((s) => s.onTST).forEach((s) => s.navOut.forEach((t) => {
    const ts = DATA.screens[t];
    if (!ts || ts.flow === s.flow || !pos[s.flow] || !pos[ts.flow]) return;
    const k = `${s.flow}>${ts.flow}`; links[k] = (links[k] || 0) + 1;
  }));
  const path = (a, b) => {
    const A = pos[a], B = pos[b];
    const ay = A.y + NH / 2, by = B.y + NH / 2;
    if (A.col === B.col) { const x = A.x + NW, bulge = x + 24 + Math.min(Math.abs(ay - by) / 8, 40); return `M${x},${ay} C${bulge},${ay} ${bulge},${by} ${x + 4},${by}`; }
    const fwd = B.col > A.col;
    const x1 = fwd ? A.x + NW : A.x, x2 = fwd ? B.x : B.x + NW;
    const dx = (x2 - x1) / 2;
    return `M${x1},${ay} C${x1 + dx},${ay} ${x2 - dx},${by} ${x2 + (fwd ? -4 : 4)},${by}`;
  };
  const j = DATA.journeys.journeys.find((x) => x.id === mapJourney);
  const jFlows = j ? j.steps.map((st) => DATA.screens[st.screen].flow) : [];
  const jEdges = new Set(); const order = {};
  jFlows.forEach((f, i) => { (order[f] = order[f] || []).push(i + 1); if (i && jFlows[i - 1] !== f) jEdges.add(`${jFlows[i - 1]}>${f}`); });
  const edges = Object.entries(links).map(([k, n]) => {
    const [a, b] = k.split('>');
    const on = jEdges.has(k);
    return `<path class="me${on ? ' on' : ''}" d="${path(a, b)}" style="stroke-width:${on ? 3 : Math.min(0.8 + n * 0.35, 4)}" marker-end="url(#${on ? 'mm-on' : 'mm'})"><title>${esc(DATA.flows[a].label)} → ${esc(DATA.flows[b].label)}: ${n} link(s)</title></path>`;
  });
  [...jEdges].filter((k) => !links[k]).forEach((k) => { const [a, b] = k.split('>'); if (pos[a] && pos[b]) edges.push(`<path class="me on" d="${path(a, b)}" style="stroke-width:3" marker-end="url(#mm-on)"/>`); });
  const nodes = Object.entries(pos).map(([f, p]) => {
    const fl = DATA.flows[f];
    const on = order[f];
    return `<a href="#flow-${esc(f)}"><g class="mn${on ? ' on' : ''}${j && !on ? ' dim' : ''}"><rect x="${p.x}" y="${p.y}" width="${NW}" height="${NH}" rx="8"/><text x="${p.x + 9}" y="${p.y + 19}">${esc((n => fl.label.length > n ? fl.label.slice(0, n - 1) + '…' : fl.label)(on ? 24 - 2 * on.length : 24))}</text>${on ? `<text class="mstep" x="${p.x + NW - 7}" y="${p.y + 19}" text-anchor="end">${on.join(' ')}</text>` : ''}<title>${esc(f)} · ${plural(fl.screens.length, 'screen')}</title></g></a>`;
  });
  main.innerHTML = `
  <section class="intro"><span class="eyebrow">App map</span><h1>The app as a map of UI flows</h1>
    <p>Each box is a UI flow with screens on TST, in columns by part of the app. A line is a link between screens of two flows; a thicker line has more links. Select a journey to see its path. The numbers are the steps.</p></section>
  <section class="panel">
    <div class="map-tools"><label class="search"><span class="eyebrow">Journey</span>
      <select id="map-journey"><option value="">No journey</option>${DATA.journeys.groups.map((g) => `<optgroup label="${esc(g)}">${DATA.journeys.journeys.filter((x) => x.group === g).map((x) => `<option value="${esc(x.id)}"${x.id === mapJourney ? ' selected' : ''}>${esc(x.id)} ${esc(x.title)}</option>`).join('')}</optgroup>`).join('')}</select></label>
      ${j ? `<a class="pill ext" href="#journey-${esc(j.id)}">Open ${esc(j.id)} in Journeys</a>` : ''}</div>
    ${j ? `<p class="muted" style="font-size:.86rem">${j.steps.map((st, i) => `${i + 1}. ${esc(st.screen)}`).join(' → ')}</p>` : ''}
    <div class="fmap appmap${j ? ' focus' : ''}"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Map of the UI flows of the app">
      <defs><marker id="mm" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path class="mk-e" d="M0,0 L8,4 L0,8 z"/></marker>
        <marker id="mm-on" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path class="mk-i" d="M0,0 L8,4 L0,8 z"/></marker></defs>
      ${MAP_COLUMNS.map((c, ci) => `<text class="colh" x="${ci * COLW}" y="18">${esc(c.title)}</text>`).join('')}
      ${edges.join('')}${nodes.join('')}
    </svg></div>
  </section>`;
  document.getElementById('map-journey').addEventListener('change', (e) => { mapJourney = e.target.value; viewMap(); });
}

const EXTERNAL = 'External map link';
function flowMapPanel(f) {
  const mids = f.screens.map((n) => DATA.screens[n]).filter((s) => s.onTST);
  if (!mids.length) return '';
  const left = new Map(), right = new Map(), internal = new Set();
  const node = (map, key, label, kind) => { if (!map.has(key)) map.set(key, { key, label, kind, to: new Set() }); return map.get(key); };
  const flowNode = (map, flowName) => {
    const fl = DATA.flows[flowName];
    return node(map, flowName, fl ? fl.label : flowName, 'flow');
  };
  mids.forEach((s) => {
    s.reachedFrom.forEach((src) => {
      const fs = DATA.screens[src] ? DATA.screens[src].flow : src;
      if (fs === f.name) internal.add(`${src}>${s.name}`); else flowNode(left, fs).to.add(s.name);
    });
    s.reachedShared.forEach((lab) => node(left, '@' + lab, lab, 'shared').to.add(s.name));
    s.navOut.forEach((t) => {
      if (t === EXTERNAL) { node(right, '@ext', EXTERNAL, 'shared').to.add(s.name); return; }
      const ft = DATA.screens[t] ? DATA.screens[t].flow : t;
      if (ft === f.name) internal.add(`${s.name}>${t}`); else flowNode(right, ft).to.add(s.name);
    });
    s.navShared.forEach((lab) => node(right, '@' + lab, lab, 'shared').to.add(s.name));
  });
  const order = (map) => [...map.values()].sort((a, b) => (a.kind === b.kind ? b.to.size - a.to.size || a.label.localeCompare(b.label) : a.kind === 'shared' ? -1 : 1));
  const L = order(left), R = order(right);
  const RH = 40, NH = 30, TOP = 34, XL = 0, WL = 196, XM = 300, WM = 236, XR = 640, WR = 196, W = XR + WR + 4;
  const rows = Math.max(L.length, mids.length, R.length, 1);
  const H = TOP + rows * RH + 6;
  const ys = (n) => { const off = TOP + ((rows - n) * RH) / 2; return (i) => off + i * RH; };
  const yl = ys(L.length), ym = ys(mids.length), yr = ys(R.length);
  const midY = {}; mids.forEach((s, i) => { midY[s.name] = ym(i) + NH / 2; });
  const curve = (x1, y1, x2, y2) => `M${x1},${y1} C${x1 + 60},${y1} ${x2 - 60},${y2} ${x2 - 6},${y2}`;
  const clip = (t, n) => (t.length > n ? t.slice(0, n - 1) + '…' : t);
  const edges = [], nodes = [];
  L.forEach((n, i) => {
    const y = yl(i) + NH / 2;
    n.to.forEach((m) => edges.push(`<path class="e" d="${curve(XL + WL, y, XM, midY[m])}" marker-end="url(#mk-e)"><title>${esc(n.label)} → ${esc(m)}</title></path>`));
  });
  R.forEach((n, i) => {
    const y = yr(i) + NH / 2;
    n.to.forEach((m) => edges.push(`<path class="e" d="${curve(XM + WM, midY[m], XR, y)}" marker-end="url(#mk-e)"><title>${esc(m)} → ${esc(n.label)}</title></path>`));
  });
  [...internal].forEach((k) => {
    const [a, b] = k.split('>');
    if (midY[a] === undefined || midY[b] === undefined || a === b) return;
    const bulge = XM + WM + Math.min(16 + (Math.abs(midY[a] - midY[b]) / RH) * 11, 92);
    edges.push(`<path class="e int" d="M${XM + WM},${midY[a]} C${bulge},${midY[a]} ${bulge},${midY[b]} ${XM + WM + 6},${midY[b]}" marker-end="url(#mk-i)"><title>${esc(a)} → ${esc(b)} (same flow)</title></path>`);
  });
  const side = (n, x, y, w, dir) => {
    const inner = `<g class="n ${n.kind}"><rect x="${x}" y="${y}" width="${w}" height="${NH}" rx="7"/><text x="${x + 10}" y="${y + 19}">${esc(clip(n.kind === 'shared' ? n.label.split(' (')[0] : n.label, 24))}</text><text class="cnt" x="${x + w - 10}" y="${y + 19}" text-anchor="end">${n.to.size}</text><title>${esc(n.kind === 'flow' ? `Flow ${n.key}: ${dir} ${n.to.size} screen(s) of this flow` : `${n.label}: ${dir} ${n.to.size} screen(s) of this flow`)}</title></g>`;
    return n.kind === 'flow' && DATA.flows[n.key] ? `<a href="#flow-${esc(n.key)}">${inner}</a>` : inner;
  };
  L.forEach((n, i) => nodes.push(side(n, XL, yl(i), WL, 'opens')));
  R.forEach((n, i) => nodes.push(side(n, XR, yr(i), WR, 'is opened from')));
  mids.forEach((s, i) => nodes.push(`<g class="n mid ${s.scope}" data-screen="${esc(s.name)}" role="button" tabindex="0" aria-label="${esc(s.name)}, open details"><rect x="${XM}" y="${ym(i)}" width="${WM}" height="${NH}" rx="7"/><text x="${XM + 10}" y="${ym(i) + 19}">${esc(clip(s.name, 30))}</text><title>${esc(s.name)} · ${esc(SCOPE[s.scope])}</title></g>`));
  return `<section class="panel" aria-labelledby="map-h"><header><h2 id="map-h">Map of this flow</h2><span class="muted" style="font-size:.84rem">Left: where users come from. Right: where they go. The number is the count of screens of this flow.</span></header>
    <div class="fmap"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Navigation map of the flow ${esc(f.name)}">
      <defs>
        <marker id="mk-e" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="mk-e" d="M0,0 L8,4 L0,8 z"/></marker>
        <marker id="mk-i" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="mk-i" d="M0,0 L8,4 L0,8 z"/></marker>
        <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect class="hatch-bg" width="6" height="6"/><line class="hatch-a" x1="0" y1="0" x2="0" y2="6"/></pattern>
      </defs>
      <text class="colh" x="${XL}" y="14">Comes from</text><text class="colh" x="${XM}" y="14">Screens of this flow</text><text class="colh" x="${XR}" y="14">Leads to</text>
      ${edges.join('')}${nodes.join('')}
    </svg></div>
    <div class="legend"><span><i class="sw in"></i>Screen in scope</span><span><i class="sw out"></i>Screen out of scope</span><span><i class="sw" style="border:1px dashed var(--accent)"></i>Shared block or app start</span><span><i class="sw" style="background:var(--accent);height:3px;vertical-align:3px"></i>Link inside the flow</span></div>
  </section>`;
}

    <p>Where the sources did not answer a question, the project owner decided. Each scope decision has a reason and a date.</p>
    <p>Navigation comes from the links in the compiled code of each screen. A link that a shared block adds to many screens (the app layout, the bottom bar) shows once, as a label. The journeys are main tasks. Each step is a link in the TST code, with the flag values of TST.</p>

function openScreen(name) {
  const s = DATA.screens[name];
  if (!s) return;
  lastFocus = document.activeElement;
  const shots = s.shots || [];
  const list = (arr) => arr && arr.length ? `<div class="pills">${arr.map((x) => `<span class="pill">${esc(x)}</span>`).join('')}</div>` : '<span class="muted">None</span>';
  drawer.innerHTML = `
    <header><span class="eyebrow">Screen · flow <a href="#flow-${esc(s.flow)}">${esc(s.flow)}</a></span>
      <h2 id="drawer-title" class="mono" style="font-family:var(--font-mono);font-size:1.25rem;overflow-wrap:anywhere">${esc(s.name)}</h2>
      <div class="facts">${chip(s.scope)}${s.specified ? '<span class="tag">Specified</span>' : ''}${s.onTST ? '' : '<span class="tag warn">Not on TST</span>'}</div>
      ${s.reason ? `<p style="color:var(--ink-2)">${esc(s.reason)}</p>` : ''}
      ${s.reopen ? `<p style="color:var(--ink-2)"><b>Reopen:</b> ${esc(s.reopen)}</p>` : ''}
      ${s.date ? `<p class="muted" style="font-size:.82rem">Decided by the project owner, ${esc(s.date)}</p>` : ''}
      ${journeyLinks(journeysOf([s.name]), 'Main journeys')}
      <button class="close" id="drawer-close" aria-label="Close">×</button></header>
    ${s.sees ? `<section style="display:grid;gap:6px"><h3>What the user sees</h3><p style="color:var(--ink-2)">${esc(s.sees)}</p>${s.does ? `<p style="color:var(--ink-2)">${esc(s.does)}</p>` : ''}${s.back ? `<p class="muted" style="font-size:.84rem">Back: ${esc(s.back)}</p>` : ''}</section>` : ''}
    <section class="shots" aria-label="TST screenshots"><h3>Screenshots on TST</h3>
      ${shots.length ? `<div class="tabs" role="tablist">${shots.map((x, i) => `<button role="tab" aria-selected="${i === 0}" data-shot="${i}">${esc(x.label)}</button>`).join('')}</div>
      <div class="phone"><img id="shot-img" src="${esc(shots[0].img)}" alt="${esc(s.name)} on TST, state ${esc(shots[0].label)}" loading="lazy"></div>
      <p class="muted" style="font-size:.8rem">Phone width 390 px. Personal data is masked in the capture.</p>`
      : `<div class="noshot">${!s.onTST ? 'This screen is not on TST, so it has no screenshot.'
        : s.noCapture ? 'No screenshot. On TST, the test account cannot open this screen without a change to the data. The capture changes no data.'
        : s.scope === 'out' ? 'No screenshot. Screens out of scope were not captured.'
        : 'No screenshot of this screen on TST.'}</div>`}
    </section>
    ${s.onTST ? `<section style="display:grid;gap:10px"><h3>Details from the TST app</h3><dl class="kv">
      <dt>URL</dt><dd class="mono" style="overflow-wrap:anywhere">${esc(s.route)}</dd>
      <dt>Inputs</dt><dd>${list(s.inputs)}</dd>
      <dt>Opens from</dt><dd>${screenPills(s.reachedFrom, s.flow, s.reachedShared)}</dd>
      <dt>Leads to</dt><dd>${screenPills(s.navOut, s.flow, s.navShared)}</dd>
      <dt>Data it loads</dt><dd>${list(s.dataActions)}</dd>
      <dt>Server actions</dt><dd>${list(s.serverActions)}</dd>
      <dt>Flags it checks</dt><dd>${list(s.flags)}</dd>
      <dt>OutSystems UI patterns</dt><dd>${list(s.osui)}</dd>
      <dt>Blocks</dt><dd>${plural(s.blocks, 'block')} in total${s.ownBlocks.length ? `, ${s.ownBlocks.length} of this module` : ''}</dd>
    </dl></section>` : ''}`;
  drawer.hidden = false; drawerBack.hidden = false;
  document.body.style.overflow = 'hidden';
  drawer.querySelectorAll('[data-shot]').forEach((b) => b.addEventListener('click', () => {
    const x = shots[+b.dataset.shot];
    drawer.querySelectorAll('[data-shot]').forEach((o) => o.setAttribute('aria-selected', String(o === b)));
    const img = document.getElementById('shot-img');
    img.src = x.img; img.alt = `${s.name} on TST, state ${x.label}`;
  }));
  document.getElementById('drawer-close').addEventListener('click', closeScreen);
  document.getElementById('drawer-close').focus();
}

function closeScreen() {
  if (drawer.hidden) return;
  drawer.hidden = true; drawerBack.hidden = true; drawer.innerHTML = '';
  document.body.style.overflow = '';
  if (location.hash.startsWith('#screen-')) {
    const s = DATA.screens[location.hash.slice(8)];
    history.replaceState(null, '', s ? `#flow-${s.flow}` : '#overview');
  }
  if (lastFocus && document.contains(lastFocus)) lastFocus.focus();
}

function labelCells() {
  main.querySelectorAll('table').forEach((t) => {
    const heads = [...t.querySelectorAll('thead th')].map((th) => th.textContent);
    t.querySelectorAll('tbody tr').forEach((tr) => [...tr.children].forEach((td, i) => { if (heads[i]) td.dataset.th = heads[i]; }));
  });
}

function route() {
  if (!DATA) { main.innerHTML = '<p class="empty">The data is missing. Run build_dashboard.py.</p>'; return; }
  const h = decodeURIComponent(location.hash.slice(1));
  let view = 'overview';
  if (h === 'health') { view = 'health'; viewHealth(); }
  else if (h === 'method') { view = 'method'; viewMethod(); }
  else if (h === 'journeys') { view = 'journeys'; viewJourneys(); }
  else if (h === 'map') { view = 'map'; viewMap(); }
  else if (h.startsWith('journey-')) { view = 'journeys'; viewJourneys(h); }
  else if (h.startsWith('flow-')) { viewFlow(h.slice(5)); view = ''; }
  else if (h.startsWith('screen-') && DATA.screens[h.slice(7)]) { viewFlow(DATA.screens[h.slice(7)].flow); view = ''; openScreen(h.slice(7)); }
  else viewOverview();
  labelCells();
  document.querySelectorAll('nav.views a').forEach((a) => {
    if (a.dataset.view === view) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  });
  if (!h.startsWith('screen-')) { closeScreen(); window.scrollTo(0, 0); }
}

main.addEventListener('click', (e) => {
  const b = e.target.closest('[data-screen]');
  if (b) openScreen(b.dataset.screen);
});
drawerBack.addEventListener('click', closeScreen);
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeScreen(); });
main.addEventListener('keydown', (e) => {
  const g = e.target.closest('g[data-screen]');
  if (g && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); openScreen(g.dataset.screen); }
});

if (LIB) {

    main.innerHTML = `
    <section class="intro"><span class="eyebrow">Shared libraries</span><h1>What the two shared libraries do on each screen</h1>
      <p>UBTConnect does not work alone. Two library modules give it feature gates, images, the device cache, pop-ups, the bottom bar, bookmarks and the legacy screens: <b>UBTConnect_Utils</b> and <b>Connect2_LegacyShared</b>. This view shows which screens use which job of the libraries, with the evidence in the model.</p>
      <p class="fresh">Source: ${esc(LIB.source.how)}, snapshot ${esc(LIB.source.takenAt)} on ${esc(LIB.source.env)}. The scope chips and the screenshots come from TST. See <a href="#method">Method</a> for the difference.</p></section>
    <section class="kpis" aria-label="Key figures">
      <div class="kpi"><b>${T.screens}</b><span>Screens in the model</span><small>${T.none} use neither library</small></div>
      <div class="kpi"><b>${T.utils}</b><span>Use UBTConnect_Utils</span><small>${T.utils_specific} with their own usage</small></div>
      <div class="kpi"><b>${T.legacy}</b><span>Use Connect2_LegacyShared</span><small>${T.legacy_specific} with their own usage</small></div>
      <div class="kpi"><b>${cu.distinct_elements}<span class="muted" style="font-size:1rem"> · ${cl.distinct_elements}</span></b><span>Elements used</span><small>of ${cu.contract_elements} · ${cl.contract_elements} referenced</small></div>
    </section>
    <section style="display:grid;gap:12px"><header><h2>The twelve jobs</h2><p class="muted" style="font-size:.86rem">Each element of a library does one job. The job name is the team name; the names in small type are the folders and UI flows of the library where the elements live.</p></header>
      <div class="ljobs">${jobPanel(MU)}${jobPanel(ML)}</div></section>
    ${areaTable()}
    ${matrix()}
    <section style="display:grid;gap:12px"><header><h2>Elements by job</h2></header>${elementTrees()}</section>
    ${shellTable()}
    ${contractPanel()}`;
    document.getElementById('lib-q').addEventListener('input', (e) => { libFilter.q = e.target.value; applyLibFilter(); });
    document.getElementById('lib-hide').addEventListener('change', (e) => { libFilter.hideInherited = e.target.checked; applyLibFilter(); });
    document.getElementById('lib-in').addEventListener('change', (e) => { libFilter.inScopeOnly = e.target.checked; applyLibFilter(); });
    main.querySelectorAll('[data-lib-seg]').forEach((b) => b.addEventListener('click', () => { libFilter.lib = b.dataset.libSeg; applyLibFilter(); }));
    applyLibFilter();
  }

  function libDrawer(n) {
    const jobs = screenJobs(n), s = lscreen(n);
    const ev = (i) => i.evidence.map((e) => `<code>${esc(e)}</code>`).join(', ');
    return `<section style="display:grid;gap:8px" aria-label="Shared libraries"><h3>Shared libraries on this screen</h3>
      ${s.description ? `<p class="muted" style="font-size:.84rem">In the model: ${esc(s.description)}</p>` : ''}
      ${jobs.length ? `<p class="muted" style="font-size:.82rem">Filled: the screen or its own blocks and actions use the element. Dashed: inherited from the common layout or the bottom bar. DEV model, ${esc(LIB.source.takenAt)}.</p>
      <dl class="kv">${jobs.map(({ job, items, own }) => `<dt style="display:flex;gap:6px;align-items:center">${ldot(job.module, !own)}${esc(job.label)}</dt><dd><div class="pills">${items.map((i) => `<span class="pill${i.inherited ? ' inh' : ''}" title="${esc(i.kind)} · ${i.inherited ? 'inherited · ' : ''}${esc(i.via || 'own')}">${esc(i.name)}</span>`).join('')}</div></dd>`).join('')}</dl>
      ${s.theme ? `<p class="muted" style="font-size:.82rem">Theme: ${esc(s.theme)} (the LegacyShared theme chain).</p>` : ''}
      <details><summary>Evidence (${jobs.reduce((k, j) => k + j.items.length, 0)} elements)</summary><ul class="lev">${jobs.flatMap(({ job, items }) => items.map((i) => `<li><span class="mono">${esc(i.name)}</span> · ${esc(job.label)} · ${esc(i.usage.join(', '))} · ${esc(i.via || 'own')}<br>${ev(i)}</li>`)).join('')}</ul></details>`
      : '<p class="muted" style="font-size:.86rem">This screen uses neither library in the model.</p>'}
    </section>`;
  }

  function renderMermaid() {
    if (!window.mermaid) return;
    const root = document.documentElement.dataset.theme;
    const dark = root === 'dark' || (!root && window.matchMedia('(prefers-color-scheme: dark)').matches);
    try {
      window.mermaid.initialize({ startOnLoad: false, theme: dark ? 'dark' : 'neutral', securityLevel: 'strict', sequence: { useMaxWidth: true } });
      const nodes = main.querySelectorAll('pre.mermaid:not([data-processed])');
      if (nodes.length) window.mermaid.run({ nodes }).catch(() => {});
    } catch (e) { /* the diagrams stay as text */ }
  }

  function libFlowPanel(name) {
    const f = LIB.flows[name];
    if (!f) return '';
    const seqs = LIB.sequences.filter((q) => q.flows.includes(name));
    const how = (e) => e.direct ? '<span class="chip in" style="font-family:var(--font-body)">Own</span>' : `<span class="muted">via ${esc(e.via.replace(/block |client_action /g, ''))}</span>`;
    const rows = f.elements.map((e) => `<tr><td class="mono">${esc(e.name)}<div class="why">${esc(e.kind)}</div></td><td>${ldot(e.module)} ${esc(SHORT[e.module])}</td><td>${esc(e.job && jobOf[e.job] ? jobOf[e.job].label : 'Other')}</td><td>${how(e)}</td><td>${e.consumers.map((c) => `<span class="pill">${esc(c.replace(/^(screen|block|client_action) /, ''))}</span>`).join(' ')}</td></tr>`).join('');
    return `<section class="panel" aria-labelledby="lfl-h"><header><h2 id="lfl-h">Shared libraries in this flow</h2><span class="muted" style="font-size:.84rem">DEV model. Own: the screens and blocks of this flow use the element. Via: reached through own blocks and actions.</span></header>
      <div class="lmeta"><span>${ldot(MU)}Utils: ${f.direct[MU]} own, ${f.via[MU]} via</span><span>${ldot(ML)}LegacyShared: ${f.direct[ML]} own, ${f.via[ML]} via</span>${f.theme ? `<span class="tag">Theme ${esc(f.theme)}</span>` : ''}</div>
      ${f.elements.length ? `<details><summary>Elements (${f.elements.length})</summary><div class="tablewrap"><table><thead><tr><th>Element</th><th>Library</th><th>Job</th><th>How</th><th>Used by</th></tr></thead><tbody>${rows}</tbody></table></div></details>` : '<p class="empty">This flow uses neither library.</p>'}
      ${seqs.length ? `<h3>How it works</h3><div class="lseq">${seqs.map((q) => `<figure><h3 style="font-size:.95rem">${esc(q.title)}</h3><pre class="mermaid">${esc(q.kind)}\n${esc(q.body)}</pre><figcaption>${esc(q.caption)}</figcaption></figure>`).join('')}</div>` : ''}
    </section>`;
  }

  function libHealth() {
    return `<section class="panel"><h3><b>${unusedCount(MU) + unusedCount(ML)}</b> Library references not used</h3><p class="muted" style="font-size:.86rem">UBTConnect references these elements of the two libraries, but no screen, block or action of the module uses them (DEV model). Other modules may still use them.</p>
      <ul><li>${ldot(MU)} UBTConnect_Utils: ${unusedCount(MU)} of ${LIB.contract[MU].contract_elements} (${esc(unusedText(MU))})</li><li>${ldot(ML)} Connect2_LegacyShared: ${unusedCount(ML)} of ${LIB.contract[ML].contract_elements} (${esc(unusedText(ML))})</li><li><a href="#libraries">Contract and use</a> in Libraries</li></ul></section>
    <section class="panel"><h3><b>${LIB.themeFlows.length}</b> Flows on the legacy theme chain</h3><p class="muted" style="font-size:.86rem">These flows render through ${LIB.themeChain.length} themes that Connect2_LegacyShared owns. The look of their screens depends on that module.</p>
      <ul>${LIB.themeFlows.map((f) => `<li><a href="#flow-${esc(f)}" class="mono">${esc(f)}</a>: ${esc(flowMeta(DATA.flows[f]))}</li>`).join('')}</ul></section>`;
  }

  function libMethod() {
    return `<section class="panel" aria-labelledby="lsrc-h"><header><h2 id="lsrc-h">Source of the library view</h2><span class="muted" style="font-size:.84rem">DEV model, ${esc(LIB.source.takenAt)}</span></header>
      <div class="prose">
        <p>The Libraries view comes from a different source than the rest of the page: the ${esc(LIB.source.how)}. The dumps hold all ${LIB.totals.screens} screens, 180 blocks, 200 client actions and 6 server actions of the module as design-time code. A parser finds each reference to UBTConnect_Utils and Connect2_LegacyShared, with the file and line as evidence.</p>
        <p><b>DEV and TST differ.</b> The model on DEV has ${DATA.counts.devOnly} screens that are not on TST. The scope decisions and the screenshots come from TST, so a screen can be out of scope on this page and still carry library marks from the model.</p>
        <p><b>References are not the run-time footprint.</b> The view counts what the UBTConnect module itself references. On the Legacy_* screens, blocks of other modules (Orbit, Assemble, LDM) render more Connect2_LegacyShared parts at run time, such as the layout <span class="mono">BaseLayout_UpdatedOSUI</span>. Those parts do not appear here because UBTConnect does not reference them directly.</p>
        <p>An element is <b>own</b> on a screen when the screen, or a block or action of its own flow, uses it. It is <b>inherited</b> when it arrives only through the common layout, the PIN block or the bottom bar. A <b>job</b> groups the elements of a library by what they do for the app; the folder and flow names of the library are shown with each job.</p>
      </div></section>`;
  }

  const base = { openScreen, viewFlow, viewHealth, viewMethod, viewOverview, route };
  openScreen = function (name) {
    base.openScreen(name);
    if (!drawer.hidden && LIB.screens[name]) drawer.insertAdjacentHTML('beforeend', libDrawer(name));
  };
  viewFlow = function (name) {
    base.viewFlow(name);
    if (DATA.flows[name]) { main.insertAdjacentHTML('beforeend', libFlowPanel(name)); renderMermaid(); }
  };
  viewHealth = function () {
    base.viewHealth();
    const grid = main.querySelector('.health');
    if (grid) grid.insertAdjacentHTML('beforeend', libHealth());
  };
  viewMethod = function () { base.viewMethod(); main.insertAdjacentHTML('beforeend', libMethod()); };
  viewOverview = function () {
    base.viewOverview();
    const decorate = () => main.querySelectorAll('.card[href^="#flow-"]').forEach((card) => {
      const f = LIB.flows[decodeURIComponent(card.getAttribute('href').slice(6))];
      if (!f || card.querySelector('.lmeta')) return;
      const n = (m) => f.direct[m] + f.via[m];
      card.insertAdjacentHTML('beforeend', `<span class="lmeta"><span>${ldot(MU)}${n(MU)}</span><span>${ldot(ML)}${n(ML)}</span><span class="muted">library elements</span></span>`);
    });
    const input = document.getElementById('flow-search');
    if (input) input.addEventListener('input', decorate);
    decorate();
    const att = main.querySelector('ul.attention');
    if (att) att.insertAdjacentHTML('beforeend', `<li><span class="ico info" aria-hidden="true">i</span><a href="#libraries">${LIB.totals.utils} screens use UBTConnect_Utils and ${LIB.totals.legacy} use Connect2_LegacyShared. The Libraries view shows what the two libraries do on each screen.</a></li>`);
    const intro = main.querySelector('.intro p:nth-of-type(2)');
    if (intro) intro.insertAdjacentHTML('beforeend', ' <a href="#libraries">Libraries</a> shows what the two shared library modules do on each screen.');
  };
  route = function () {
    if (decodeURIComponent(location.hash.slice(1)) === 'libraries') {
      viewLibraries(); labelCells(); closeScreen(); window.scrollTo(0, 0);
      document.querySelectorAll('nav.views a').forEach((a) => { if (a.dataset.view === 'libraries') a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
      return;
    }
    base.route();
  };
  main.addEventListener('keydown', (e) => {
    const tr = e.target.closest('tr.lrow[data-screen]');
    if (tr && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); openScreen(tr.dataset.screen); }
  });
}
/*[/lib]*/
window.addEventListener('hashchange', route);
route();
</script>
